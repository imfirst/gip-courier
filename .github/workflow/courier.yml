name: gip-courier
on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub запускает примерно раз в 5 минут (бывают задержки)
  workflow_dispatch: {}       # ручной запуск кнопкой Run workflow
concurrency:
  group: gip-courier
  cancel-in-progress: false
jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run courier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CRM_KEY: ${{ secrets.CRM_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RUN_SECONDS: '270'
        run: python3 courier.py
