name: gip-courier
on:
  schedule:
    - cron: '*/20 * * * *'    # подстраховка: если курьер остановился, через ≤20 мин запустится снова
  workflow_dispatch: {}
concurrency:
  group: gip-courier
  cancel-in-progress: false   # новый запуск ждёт, пока закончится текущий
jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Run courier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CRM_KEY: ${{ secrets.CRM_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RUN_SECONDS: '20700'   # 5 ч 45 мин
        run: python3 courier.py
